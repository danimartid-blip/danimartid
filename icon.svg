<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- fondo: degradado diagonal con profundidad -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2ad1b0"/>
      <stop offset="42%"  stop-color="#12907c"/>
      <stop offset="100%" stop-color="#053b33"/>
    </linearGradient>
    <!-- brillo superior izquierdo, da volumen -->
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.8">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- sombra interior inferior -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00201b" stop-opacity="0.35"/>
    </linearGradient>
    <!-- cara del signo: metálico claro -->
    <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="48%"  stop-color="#f2fffb"/>
      <stop offset="100%" stop-color="#a9e6d6"/>
    </linearGradient>
    <!-- extrusión lateral del signo -->
    <linearGradient id="extrude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b6053"/>
      <stop offset="100%" stop-color="#04302a"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="118"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- línea de tendencia al fondo, sutil -->
    <path d="M64 372 L186 250 L262 318 L448 128" fill="none" stroke="#ffffff" stroke-opacity="0.16"
          stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="448" cy="128" r="21" fill="#ffffff" fill-opacity="0.22"/>

    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#vignette)"/>

    <!-- signo peso: capas de extrusión + cara -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
       font-weight="800" font-size="300" text-anchor="middle">
      <text x="256" y="366" fill="url(#extrude)" transform="translate(14,16)">$</text>
      <text x="256" y="366" fill="url(#extrude)" transform="translate(10,11)">$</text>
      <text x="256" y="366" fill="url(#extrude)" transform="translate(6,7)">$</text>
      <text x="256" y="366" fill="url(#face)">$</text>
    </g>

    <!-- reflejo diagonal de vidrio -->
    <path d="M-40 150 L200 -60 L300 -60 L-40 300 Z" fill="#ffffff" fill-opacity="0.07"/>
  </g>

  <!-- borde interior para que no se vea plano sobre fondos claros -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
</svg>
