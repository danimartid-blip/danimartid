<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Finanzas</title>
<meta name="theme-color" content="#0e7c6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css?v=202609261928">
</head>
<body>

<header class="topbar">
  <h1>Finanzas</h1>
  <select id="monthSelect" class="native"></select>
</header>

<div class="container">

  <div id="loadingSkeleton" class="skeleton" hidden>Cargando tus datos…</div>

  <div id="dashboard" hidden>
    <div class="card card-hero">
      <div class="hero-grid">
        <div class="hero-box hero-box-liquidez">
          <div class="hero-head">
            <span class="stat-label">Liquidez</span>
            <button type="button" class="info-btn" data-info="infoLiquidez" aria-label="Cómo se calcula la liquidez">?</button>
          </div>
          <div class="stat-value hero-num" id="statLiquidezPpto">$0</div>
          <div class="hero-estado" id="liquidezEstado" hidden></div>
        </div>

        <div class="hero-box hero-box-patrimonio">
          <div class="hero-head">
            <span class="stat-label">Patrimonio líquido</span>
            <button type="button" class="info-btn" data-info="infoPatrimonio" aria-label="Cómo se calcula el patrimonio líquido">?</button>
          </div>
          <div class="stat-value hero-num" id="statPatrimonioLiquido">$0</div>
        </div>

        <div class="hero-box hero-box-saldo hero-box-wide">
          <div class="hero-head">
            <span class="stat-label">Saldo actual</span>
            <button type="button" class="info-btn" data-info="infoSaldo" aria-label="Cómo se calcula el saldo actual">?</button>
          </div>
          <div class="stat-value hero-num-sm" id="liquidezRealValue">$0</div>
        </div>
      </div>

      <p class="hero-info" id="infoLiquidez" hidden></p>
      <p class="hero-info" id="infoPatrimonio" hidden></p>
      <p class="hero-info" id="infoSaldo" hidden></p>
    </div>

    <div class="card" id="conciliacionCard">
      <div class="card-title">Conciliación</div>
      <div id="conciliacionBody"></div>
    </div>

    <div class="card">
      <div class="card-title">Tendencia (últimos meses)</div>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:var(--income)"></span>Ingresos</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--expense)"></span>Gastos</span>
      </div>
      <div class="chart-wrap">
        <svg id="trendChart" width="100%" height="140" viewBox="0 0 320 140" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="chart-tooltip" id="trendTooltip"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Por categoría vs. presupuesto</div>
      <div class="macro" id="macroGasto">
        <button type="button" class="macro-head macro-gasto" id="toggleGastoTipo" aria-expanded="false" aria-controls="categoryList">
          <span class="macro-line">
            <span class="macro-label">Gastos</span>
            <span class="macro-chip" id="chipGastoMes"></span>
            <span class="macro-chev" aria-hidden="true"></span>
          </span>
          <span class="macro-num expense" id="totalGastoMes">$0</span>
          <span class="bar-track"><span class="bar-fill" id="barGastoMes" data-w="0" style="width:0%"></span></span>
          <span class="macro-foot" id="footGastoMes"></span>
        </button>
        <div class="cat-detail" id="categoryList" hidden></div>
      </div>
      <div class="macro" id="macroIngreso">
        <button type="button" class="macro-head macro-ingreso" id="toggleIngresoTipo" aria-expanded="false" aria-controls="categoryListIngreso">
          <span class="macro-line">
            <span class="macro-label">Ingresos</span>
            <span class="macro-chip" id="chipIngresoMes"></span>
            <span class="macro-chev" aria-hidden="true"></span>
          </span>
          <span class="macro-num income" id="totalIngresoMes">$0</span>
          <span class="bar-track"><span class="bar-fill" id="barIngresoMes" data-w="0" style="width:0%"></span></span>
          <span class="macro-foot" id="footIngresoMes"></span>
        </button>
        <div class="cat-detail" id="categoryListIngreso" hidden></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Fuera de presupuesto</div>
      <div class="macro" id="macroFuera">
        <button type="button" class="macro-head macro-fuera" id="toggleFueraPpto" aria-expanded="false" aria-controls="fueraPptoDetalle">
          <span class="macro-line">
            <span class="macro-label">Gastado de más este mes</span>
            <span class="macro-chip" id="chipFueraPpto"></span>
            <span class="macro-chev" aria-hidden="true"></span>
          </span>
          <span class="macro-num" id="statFueraPpto"></span>
          <span class="macro-foot" id="footFueraPpto"></span>
        </button>
        <div class="cat-detail" id="fueraPptoDetalle" hidden></div>
      </div>
    </div>

    <div class="card" id="creditoCard">
      <div class="card-title">Crédito</div>
      <div class="credito-grid">
        <button type="button" class="macro-mini macro-mini-pagar" id="togglePorPagar" aria-expanded="false" aria-controls="porPagarPeriodos">
          <span class="macro-mini-line">
            <span class="macro-mini-label">Debes</span>
            <span class="macro-chev" aria-hidden="true"></span>
          </span>
          <span class="macro-mini-num" id="statPorPagar">$0</span>
          <span class="macro-mini-foot" id="footPorPagar"></span>
        </button>
        <button type="button" class="macro-mini macro-mini-cobrar" id="togglePorCobrar" aria-expanded="false" aria-controls="porCobrarPersonas">
          <span class="macro-mini-line">
            <span class="macro-mini-label">Te deben</span>
            <span class="macro-chev" aria-hidden="true"></span>
          </span>
          <span class="macro-mini-num" id="statPorCobrar">$0</span>
          <span class="macro-mini-foot" id="footPorCobrar"></span>
        </button>
      </div>
      <div class="credito-neto" id="creditoNeto"></div>
      <div class="macro">
        <div class="cat-detail" id="porPagarPeriodos" hidden></div>
      </div>
      <div class="macro">
        <div class="cat-detail" id="porCobrarPersonas" hidden></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
