<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Finanzas</title>
<meta name="theme-color" content="#0e7c6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css?v=202609152156">
</head>
<body>

<header class="topbar">
  <h1>Finanzas</h1>
  <select id="monthSelect" class="native"></select>
</header>

<div class="container">

  <div id="loadingSkeleton" class="skeleton" hidden>Cargando tus datos…</div>

  <div id="dashboard" hidden>
    <div class="card card-hero">
      <div class="hero-grid">
        <div class="hero-box hero-box-liquidez">
          <div class="hero-head">
            <span class="stat-label">Liquidez</span>
            <button type="button" class="info-btn" data-info="infoLiquidez" aria-label="Cómo se calcula la liquidez">?</button>
          </div>
          <div class="stat-value hero-num" id="statLiquidezPpto">$0</div>
          <div class="hero-estado" id="liquidezEstado" hidden></div>
        </div>

        <div class="hero-box hero-box-patrimonio">
          <div class="hero-head">
            <span class="stat-label">Patrimonio líquido</span>
            <button type="button" class="info-btn" data-info="infoPatrimonio" aria-label="Cómo se calcula el patrimonio líquido">?</button>
          </div>
          <div class="stat-value hero-num" id="statPatrimonioLiquido">$0</div>
        </div>

        <div class="hero-box hero-box-saldo hero-box-wide">
          <div class="hero-head">
            <span class="stat-label">Saldo actual</span>
            <button type="button" class="info-btn" data-info="infoSaldo" aria-label="Cómo se calcula el saldo actual">?</button>
          </div>
          <div class="stat-value hero-num-sm" id="liquidezRealValue">$0</div>
        </div>
      </div>

      <p class="hero-info" id="infoLiquidez" hidden></p>
      <p class="hero-info" id="infoPatrimonio" hidden></p>
      <p class="hero-info" id="infoSaldo" hidden></p>
    </div>

    <div class="card" id="conciliacionCard">
      <div class="card-title">Conciliación</div>
      <div id="conciliacionBody"></div>
    </div>

    <div class="card">
      <div class="card-title">Tendencia (últimos meses)</div>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:var(--income)"></span>Ingresos</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--expense)"></span>Gastos</span>
      </div>
      <div class="chart-wrap">
        <svg id="trendChart" width="100%" height="140" viewBox="0 0 320 140" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="chart-tooltip" id="trendTooltip"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Por categoría vs. presupuesto</div>
      <div class="category-row">
        <div class="category-row-top cat-clickable" id="toggleGastoTipo">
          <span class="cat-name">Gastos</span>
          <span class="cat-amounts expense" id="totalGastoMes"></span>
        </div>
        <div class="cat-detail" id="categoryList" hidden></div>
      </div>
      <div class="category-row">
        <div class="category-row-top cat-clickable" id="toggleIngresoTipo">
          <span class="cat-name">Ingresos</span>
          <span class="cat-amounts income" id="totalIngresoMes"></span>
        </div>
        <div class="cat-detail" id="categoryListIngreso" hidden></div>
      </div>
    </div>

    <div class="card">
      <div class="dual-stat">
        <div>
          <div class="stat-label">Por pagar</div>
          <div class="stat-value" style="color:var(--serious)" id="statPorPagar">$0</div>
        </div>
        <div>
          <div class="stat-label">Por cobrar</div>
          <div class="stat-value income" id="statPorCobrar">$0</div>
        </div>
      </div>

      <div class="venc-header">
        <span>Vence</span>
        <span class="venc-montos">
          <span class="venc-monto">Por pagar</span>
          <span class="venc-monto">Por cobrar</span>
        </span>
      </div>
      <div id="porPagarPeriodos"></div>
    </div>
  </div>
</div>

    Registrar
  </a>
  <a href="presupuesto.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3.2V12l6.2 6.2"/></svg>
    Presupuesto
  </a>
  <a href="cuentas.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.8" r="1.15"/></svg>
    Cuentas
  </a>
  <a href="habitos.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    Hábitos
  </a>
</nav>

</body>
</html>
