<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Variante "maskable": SIN esquinas propias (el launcher aplica su propia
       forma: círculo, squircle, gota...) y el contenido importante centrado
       dentro de la "safe zone" (círculo central del 66% del lienzo), para que
       ningún launcher lo recorte. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2ad1b0"/>
      <stop offset="42%"  stop-color="#12907c"/>
      <stop offset="100%" stop-color="#053b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.8">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00201b" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="48%"  stop-color="#f2fffb"/>
      <stop offset="100%" stop-color="#a9e6d6"/>
    </linearGradient>
    <linearGradient id="extrude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b6053"/>
      <stop offset="100%" stop-color="#04302a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- signo peso, escalado ~68% y centrado: cabe en la safe zone de cualquier máscara -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-weight="800" font-size="204" text-anchor="middle">
    <text x="256" y="329" fill="url(#extrude)" transform="translate(10,11)">$</text>
    <text x="256" y="329" fill="url(#extrude)" transform="translate(7,8)">$</text>
    <text x="256" y="329" fill="url(#extrude)" transform="translate(4,5)">$</text>
    <text x="256" y="329" fill="url(#face)">$</text>
  </g>
</svg>
